<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Tino — Find jobs that will actually sponsor your UK visa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; padding: 0; margin: 0; }
:root {
  --bg:#021e1e; --bg-mid:#032a2a; --teal:#1BAAC1;
  --teal-12:rgba(27,170,193,0.12); --teal-30:rgba(27,170,193,0.30);
  --teal-dim:#0a2828; --w100:#fff;
  --w80:rgba(255,255,255,.80); --w60:rgba(255,255,255,.60);
  --w40:rgba(255,255,255,.40); --w20:rgba(255,255,255,.20);
  --w10:rgba(255,255,255,.10); --w06:rgba(255,255,255,.06);
  --glass:rgba(3,40,40,.80); --gborder:rgba(255,255,255,.10);
  --font:'Plus Jakarta Sans',sans-serif; --mono:'DM Mono',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{font-family:var(--font);color:var(--w100);-webkit-font-smoothing:antialiased;}

/* ── CANVAS BG ── */
#beam-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ── NAV ── */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;height:52px;
  display:flex;align-items:center;justify-content:space-between;padding:0 28px;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:rgba(2,20,20,.55);backdrop-filter:blur(16px);
}
.nav-logo{display:flex;align-items:center;gap:10px;cursor:pointer;}
.nav-beta{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--teal);border:1px solid var(--teal-30);padding:3px 8px;border-radius:3px;}
.nav-right{display:flex;align-items:center;gap:20px;}
.nav-link{font-size:13px;font-weight:400;color:var(--w60);text-decoration:none;transition:color .15s;}
.nav-link:hover{color:var(--w100);}
.nav-cta{font-size:13px;font-weight:600;color:var(--teal-dim);background:var(--teal);
  padding:7px 16px;text-decoration:none;transition:background .15s;border:none;cursor:pointer;}
.nav-cta:hover{background:#21c8e2;}

/* ── STAGE ── */
.stage{position:fixed;inset:0;z-index:3;display:flex;align-items:center;
  justify-content:center;padding:52px 0 132px;overflow:hidden;}

/* ── SLIDE ── */
.slide-inner{
  width:100%;max-width:1300px;padding:0 60px;
  position:absolute;pointer-events:none;
}
.slide-inner.active{pointer-events:auto;}

/* ── HERO ── */
.hero-eyebrow{font-family:var(--mono);font-size:11px;font-weight:300;color:var(--teal);
  letter-spacing:2px;text-transform:uppercase;margin-bottom:26px;opacity:.85;}
.hero-h1{font-size:clamp(3.4rem,7vw,7rem);font-weight:700;line-height:1.04;
  letter-spacing:-.03em;color:var(--w100);margin-bottom:30px;}
.hero-h1 em{font-style:normal;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:8px;}
.hero-h1 .ac{color:var(--teal);}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;}
.stat-chip{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;
  color:var(--w60);background:rgba(27,170,193,.07);border:1px solid rgba(27,170,193,.18);
  padding:7px 14px;border-radius:4px;}
.stat-chip strong{color:var(--teal);font-weight:700;}
.stat-chip-sep{width:3px;height:3px;border-radius:50%;background:var(--teal-30);}

/* ── SPLIT ── */
.split{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;}
.split-label{font-family:var(--mono);font-size:10px;font-weight:300;color:rgba(27,170,193,.55);
  letter-spacing:1.8px;text-transform:uppercase;margin-bottom:18px;}
.split-h2{font-size:clamp(2rem,3.5vw,3.4rem);font-weight:700;line-height:1.08;
  letter-spacing:-.025em;color:var(--w100);margin-bottom:18px;}
.split-h2 em{font-style:normal;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;}
.split-h2 .ac{color:var(--teal);}
.split-body{font-size:15px;font-weight:400;line-height:1.75;color:var(--w60);max-width:400px;}

/* ── APP FRAME ── */
.af{
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius:14px;overflow:hidden;
  box-shadow:
    0 40px 80px rgba(0,0,0,0.50),
    0 0 0 1px rgba(27,170,193,0.08),
    inset 0 1px 0 rgba(255,255,255,0.10),
    inset 0 -1px 0 rgba(0,0,0,0.15);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  will-change:transform,opacity;
}
.af-bar{display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:38px;
  background:rgba(2,22,22,0.70);border-bottom:1px solid rgba(255,255,255,0.09);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.af-bar-title{font-size:11px;font-weight:600;color:var(--w80);}
.af-avatar{width:22px;height:22px;border-radius:50%;background:var(--teal);display:flex;
  align-items:center;justify-content:center;font-size:8px;font-weight:800;color:var(--teal-dim);}
.af-body{padding:14px;}
.af-side-layout{display:flex;height:280px;}
.af-sidebar{width:40px;background:rgba(2,14,14,0.65);border-right:1px solid rgba(255,255,255,0.08);
  display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px;flex-shrink:0;}
.af-icon{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;
  justify-content:center;font-size:10px;color:var(--w40);}
.af-icon.on{background:rgba(27,170,193,.12);color:var(--teal);}
.af-main{flex:1;padding:12px;overflow:hidden;}
.gc{background:rgba(255,255,255,0.055);border:1px solid rgba(255,255,255,0.11);border-radius:8px;padding:10px 12px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.sh{background:rgba(74,222,128,.12);color:#4ade80;font-size:10px;font-weight:700;padding:2px 7px;
  border-radius:3px;display:inline-flex;align-items:center;gap:3px;}
.sm{background:rgba(251,191,36,.12);color:#fbbf24;font-size:10px;font-weight:700;padding:2px 7px;
  border-radius:3px;display:inline-flex;align-items:center;gap:3px;}
.sdot{width:4px;height:4px;border-radius:50%;background:currentColor;}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:100px;font-size:10px;
  font-weight:500;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.55);}
.pill.on{background:rgba(27,170,193,.10);border-color:rgba(27,170,193,.30);color:var(--teal);}
.prog{height:2px;background:rgba(255,255,255,.07);border-radius:1px;overflow:hidden;margin-top:3px;}
.prog-fill{height:100%;background:var(--teal);border-radius:1px;}

/* assemble pieces */
.assemble-sidebar{transform:translateX(-30px);opacity:0;}
.assemble-card{transform:translateY(24px);opacity:0;}
.assemble-bar{transform:scaleY(0);transform-origin:bottom;opacity:0;}

/* ── FOOTER ── */
.footer{position:fixed;bottom:0;left:0;right:0;z-index:10;height:72px;
  display:flex;align-items:center;justify-content:space-between;padding:0 28px;
  border-top:1px solid rgba(255,255,255,.06);
  background:rgba(2,16,16,.6);backdrop-filter:blur(16px);}
.footer-links{width:28%;display:flex;gap:16px;}
.footer-link{font-size:12px;color:var(--w40);text-decoration:none;transition:color .15s;}
.footer-link:hover{color:var(--w80);}
.controls{display:flex;align-items:center;gap:14px;}
.ctrl-btn{cursor:pointer;font-size:11px;font-weight:500;color:rgba(255,255,255,.5);
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
  padding:7px 16px;border-radius:0;font-family:var(--font);transition:all .15s;}
.ctrl-btn:hover{background:rgba(255,255,255,.08);color:var(--w80);}
.dots{display:flex;align-items:center;gap:6px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.18);cursor:pointer;transition:all .35s cubic-bezier(.34,1.56,.64,1);}
.dot.on{background:rgba(255,255,255,.70);width:18px;border-radius:3px;}
.counter{font-family:var(--mono);font-size:10px;font-weight:300;color:rgba(255,255,255,.30);min-width:36px;text-align:right;}

/* ── MAGNETIC CTA ── */
.cta-strip{position:fixed;bottom:72px;left:0;right:0;z-index:9;display:flex;justify-content:center;}
.cta-btn{
  display:inline-flex;align-items:center;gap:12px;
  background:var(--teal);color:var(--teal-dim);
  font-family:var(--font);font-size:14px;font-weight:700;
  padding:16px 36px;border:none;cursor:pointer;
  transition:background .2s,box-shadow .2s;
  will-change:transform;
  box-shadow:0 0 0 0 rgba(27,170,193,0);
}
.cta-btn:hover{background:#21c8e2;box-shadow:0 8px 32px rgba(27,170,193,.35);}
.cta-arrow{fill:none;stroke:var(--teal-dim);width:16px;height:16px;transition:transform .3s;}

/* ── PROGRESS ── */
.prog-bar{position:fixed;bottom:72px;left:0;height:2px;background:rgba(27,170,193,.5);z-index:11;pointer-events:none;}

/* ── SCROLL HINT ── */
.scroll-hint{
  position:fixed;right:28px;top:50%;transform:translateY(-50%);
  z-index:10;display:flex;flex-direction:column;align-items:center;gap:8px;
}
.scroll-track{width:2px;height:60px;background:rgba(255,255,255,.10);border-radius:1px;position:relative;overflow:hidden;}
.scroll-thumb{
  position:absolute;top:0;left:0;width:2px;border-radius:1px;
  background:var(--teal);transition:top .4s cubic-bezier(.4,0,.2,1),height .4s;
}

@media(max-width:1100px){.split{gap:48px;}}
@media(max-width:860px){.split{grid-template-columns:1fr;}.split-screen{display:none;}.hero-h1{font-size:clamp(2.6rem,8vw,4rem);}.slide-inner{padding:0 24px;}}
@media(max-width:600px){.footer-links{display:none;}.nav-link{display:none;}}
@media(prefers-reduced-motion:reduce){.kl.in{animation:none;opacity:1;transform:none;}}
</style>
</head>
<body>
<canvas id="beam-canvas"></canvas>

<header class="nav">
  <div class="nav-logo">
    <svg width="54" height="22" viewBox="0 0 56 26" fill="none" aria-label="Tino">
      <line x1="2" y1="3" x2="13" y2="3" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round"/>
      <line x1="7.5" y1="3" x2="7.5" y2="23" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round"/>
      <rect x="16" y="2" width="6" height="6" rx="1.8" fill="#1BAAC1"/>
      <line x1="19" y1="10" x2="19" y2="23" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round"/>
      <line x1="24" y1="10" x2="24" y2="23" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round"/>
      <path d="M24 13 Q24 10 27.5 10 Q31 10 31 13 L31 23" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round" fill="none"/>
      <rect x="34" y="10" width="11" height="13" rx="4.5" stroke="rgba(255,255,255,0.85)" stroke-width="2" fill="none"/>
    </svg>
    <span class="nav-beta">Beta</span>
  </div>
  <div class="nav-right">
    <a class="nav-link" href="#">How it works</a>
    <a class="nav-link" href="#">Pricing</a>
    <a class="nav-cta" href="#">Sign in</a>
  </div>
</header>

<div class="stage" id="stage"></div>

<div class="cta-strip">
  <button class="cta-btn" id="ctaBtn">
    <span id="ctaText">Browse sponsored jobs</span>
    <svg class="cta-arrow" viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 8h10M9 4l4 4-4 4"/>
    </svg>
  </button>
</div>

<div class="scroll-hint" id="scrollHint">
  <div class="scroll-track"><div class="scroll-thumb" id="scrollThumb"></div></div>
</div>

<footer class="footer">
  <div class="footer-links">
    <a class="footer-link" href="#">Privacy</a>
    <a class="footer-link" href="#">Terms</a>
    <a class="footer-link" href="#">Blog</a>
    <a class="footer-link" href="#">LinkedIn</a>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="prevBtn">← Prev</button>
    <div class="dots" id="dots"></div>
    <button class="ctrl-btn" id="nextBtn">Next →</button>
  </div>
  <div class="counter" id="counter">1 / 8</div>
</footer>

<div class="prog-bar" id="progBar" style="width:0%"></div>

<script>
const LOGO = `<svg width="32" height="14" viewBox="0 0 56 26" fill="none"><line x1="2" y1="3" x2="13" y2="3" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/><line x1="7.5" y1="3" x2="7.5" y2="23" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/><rect x="16" y="2" width="6" height="6" rx="1.8" fill="#1BAAC1"/><line x1="19" y1="10" x2="19" y2="23" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/><line x1="24" y1="10" x2="24" y2="23" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/><path d="M24 13 Q24 10 27.5 10 Q31 10 31 13 L31 23" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" fill="none"/><rect x="34" y="10" width="11" height="13" rx="4.5" stroke="rgba(255,255,255,0.8)" stroke-width="2" fill="none"/></svg>`;

const TOPBAR = t => `<div class="af-bar"><div style="display:flex;align-items:center;gap:8px;">${LOGO}<span class="af-bar-title">${t}</span></div><div class="af-avatar">AT</div></div>`;

const SIDEBAR = a => `<div class="af-sidebar">
  <div class="af-icon ${a===0?'on':''}" title="Jobs">◉</div>
  <div class="af-icon ${a===1?'on':''}" title="Tracker">▤</div>
  <div class="af-icon ${a===2?'on':''}" title="CV">≡</div>
  <div class="af-icon ${a===3?'on':''}" title="Analytics">↗</div>
  <div style="margin-top:auto;" class="af-icon" title="Sign out">↩</div>
</div>`;

function sLogin() {
  return `<div class="af" style="max-width:320px;margin:0 auto;">${TOPBAR('Sign in')}
  <div class="af-body" style="padding:20px;">
    <div style="margin-bottom:18px;">
      <div style="font-size:15px;font-weight:700;margin-bottom:5px;letter-spacing:-0.3px;">Welcome back.</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.52);">Sign in to your sponsorship tracker</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:13px;">
      <div>
        <div style="font-size:10px;color:rgba(255,255,255,0.52);margin-bottom:5px;font-weight:500;letter-spacing:0.2px;">Email</div>
        <div style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.16);border-radius:5px;padding:8px 11px;font-size:11px;color:rgba(255,255,255,0.40);">you@example.com</div>
      </div>
      <div>
        <div style="font-size:10px;color:rgba(255,255,255,0.52);margin-bottom:5px;font-weight:500;letter-spacing:0.2px;">Password</div>
        <div style="background:rgba(255,255,255,0.07);border:1px solid rgba(27,170,193,0.45);border-radius:5px;padding:8px 11px;font-size:11px;color:rgba(255,255,255,0.55);">••••••••</div>
      </div>
      <div style="text-align:right;font-size:10px;color:#1BAAC1;cursor:pointer;">Forgot password?</div>
    </div>
    <div style="background:#1BAAC1;color:#0a2828;padding:10px;text-align:center;font-size:12px;font-weight:700;margin-bottom:11px;cursor:pointer;border-radius:2px;">Sign in →</div>
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:11px;">
      <div style="flex:1;height:1px;background:rgba(255,255,255,0.10);"></div>
      <span style="font-size:10px;color:rgba(255,255,255,0.45);">or</span>
      <div style="flex:1;height:1px;background:rgba(255,255,255,0.10);"></div>
    </div>
    <div style="border:1px solid rgba(255,255,255,0.16);border-radius:2px;padding:9px;text-align:center;font-size:11px;color:rgba(255,255,255,0.65);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;">
      <span style="font-weight:800;color:#4285f4;font-size:13px;">G</span>Continue with Google
    </div>
    <div style="text-align:center;margin-top:12px;font-size:10px;color:rgba(255,255,255,0.48);">No account? <span style="color:#1BAAC1;cursor:pointer;">Create one free →</span></div>
  </div></div>`;
}

function sOnboarding() {
  const steps = ['Visa type','Upload CV','Your roles','Alerts'];
  return `<div class="af" style="max-width:420px;margin:0 auto;">${TOPBAR('Get started')}
  <div class="af-body">
    <div style="display:flex;align-items:center;margin-bottom:18px;overflow-x:auto;scrollbar-width:none;">
      ${steps.map((s,i)=>`<div style="display:flex;align-items:center;gap:0;"><div style="display:flex;align-items:center;gap:5px;padding:4px 0;"><div style="width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;background:${i<2?'#1BAAC1':'rgba(255,255,255,0.08)'};color:${i<2?'#0a2828':'rgba(255,255,255,0.38)'};">${i<2?'✓':(i+1)}</div><span style="font-size:11px;white-space:nowrap;color:${i===1?'#1BAAC1':'rgba(255,255,255,0.42)'};">${s}</span></div>${i<3?`<div style="width:18px;height:1px;background:rgba(255,255,255,0.12);margin:0 5px;flex-shrink:0;"></div>`:''}</div>`).join('')}
    </div>
    <div style="text-align:center;margin-bottom:14px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:6px;letter-spacing:-0.2px;">Upload your CV</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.52);line-height:1.55;max-width:260px;margin:0 auto;">Claude reads it and suggests matching job titles automatically.</div>
    </div>
    <div style="border:1px dashed rgba(27,170,193,0.30);border-radius:7px;padding:22px;text-align:center;background:rgba(27,170,193,0.03);margin-bottom:12px;">
      <div style="font-size:22px;margin-bottom:7px;opacity:0.55;">↑</div>
      <div style="font-size:12px;font-weight:600;margin-bottom:4px;">Drop your CV here</div>
      <div style="font-size:10px;color:rgba(255,255,255,0.48);">PDF or Word · max 10MB · click to browse</div>
    </div>
    <div style="font-size:10px;color:rgba(255,255,255,0.45);text-align:center;margin-bottom:13px;">ⓘ Your CV is never shared with employers</div>
    <div style="display:flex;gap:8px;">
      <div style="flex:1;border:1px solid rgba(255,255,255,0.16);border-radius:2px;padding:9px;text-align:center;font-size:11px;color:rgba(255,255,255,0.52);cursor:pointer;">← Back</div>
      <div style="flex:2;background:#1BAAC1;color:#0a2828;border-radius:2px;padding:9px;text-align:center;font-size:11px;font-weight:700;cursor:pointer;">Continue →</div>
    </div>
  </div></div>`;
}

function sJobs() {
  const jobs = [
    {ab:'DE',bg:'#c41230',t:'Senior Software Engineer',co:'Deliveroo',loc:'London',s:'sh',sv:'High · 91',sal:'£75k – £95k',age:'2h',tag:'Direct hire'},
    {ab:'KP',bg:'#00338d',t:'Backend Engineer',co:'KPMG Technology',loc:'Manchester',s:'sh',sv:'High · 88',sal:'£60k – £75k',age:'5h',tag:'Direct hire'},
    {ab:'SP',bg:'#1db954',t:'Platform Engineer',co:'Spotify',loc:'London',s:'sh',sv:'High · 94',sal:'£80k – £105k',age:'3h',tag:'Sponsor confirmed'},
    {ab:'JL',bg:'#007a5e',t:'Full Stack Developer',co:'John Lewis',loc:'London',s:'sm',sv:'Medium · 67',sal:'£55k – £70k',age:'1d',tag:'Agency posting'},
  ];
  return `<div class="af" style="width:100%;">${TOPBAR('Jobs feed')}
  <div class="af-side-layout">${SIDEBAR(0)}<div class="af-main">
    <div style="margin-bottom:9px;">
      <div style="font-size:12px;font-weight:700;margin-bottom:3px;letter-spacing:-0.2px;">Jobs for you</div>
      <div style="font-size:10px;color:rgba(255,255,255,0.50);">847 verified sponsor roles · updated today</div>
    </div>
    <div style="display:flex;gap:4px;margin-bottom:9px;flex-wrap:wrap;">${['All roles','High score','Direct hire','Remote','£40k+'].map((f,i)=>`<span class="pill${i===0?' on':''}">${f}</span>`).join('')}</div>

// ═══════════════════════════════════════════════════════════════════
// 1. BEAM CANVAS — particles travel along grid lines toward cursor
// ═══════════════════════════════════════════════════════════════════
const canvas = document.getElementById('beam-canvas');
const ctx = canvas.getContext('2d');
const GRID = 72;
let cw, ch, mouseX = -999, mouseY = -999;

function resizeCanvas() {
  cw = canvas.width  = window.innerWidth;
  ch = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

// Beam particles
const beams = [];
const MAX_BEAMS = 28;

function spawnBeam() {
  // Pick a random grid line near the cursor
  const gx = Math.round(mouseX / GRID) * GRID + (Math.random() > 0.5 ? GRID : -GRID) * Math.floor(Math.random() * 3);
  const gy = Math.round(mouseY / GRID) * GRID + (Math.random() > 0.5 ? GRID : -GRID) * Math.floor(Math.random() * 3);
  const horizontal = Math.random() > 0.5;
  beams.push({
    x: horizontal ? (Math.random() > 0.5 ? -20 : cw + 20) : Math.round(gx / GRID) * GRID,
    y: horizontal ? Math.round(gy / GRID) * GRID : (Math.random() > 0.5 ? -20 : ch + 20),
    dx: horizontal ? (Math.random() > 0.5 ? 2.5 : -2.5) : 0,
    dy: horizontal ? 0 : (Math.random() > 0.5 ? 2.5 : -2.5),
    len: 40 + Math.random() * 80,
    alpha: 0,
    life: 0,
    maxLife: 120 + Math.random() * 80,
    color: Math.random() > 0.3 ? '27,170,193' : '255,255,255',
  });
}

function drawBeams() {
  ctx.clearRect(0, 0, cw, ch);

  // Faint grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < cw; x += GRID) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,ch); ctx.stroke(); }
  for (let y = 0; y < ch; y += GRID) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cw,y); ctx.stroke(); }

  // Cursor glow
  if (mouseX > 0) {
    const g = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 180);
    g.addColorStop(0, 'rgba(27,170,193,0.07)');
    g.addColorStop(1, 'rgba(27,170,193,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cw, ch);
  }

  // Beams
  beams.forEach((b, i) => {
    b.life++;
    b.x += b.dx;
    b.y += b.dy;
    b.alpha = b.life < 20 ? b.life / 20 : b.life > b.maxLife - 20 ? (b.maxLife - b.life) / 20 : 1;

    const tail = { x: b.x - b.dx * b.len, y: b.y - b.dy * b.len };
    const grad = ctx.createLinearGradient(tail.x, tail.y, b.x, b.y);
    grad.addColorStop(0, `rgba(${b.color},0)`);
    grad.addColorStop(1, `rgba(${b.color},${b.alpha * 0.7})`);
    ctx.beginPath();
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.moveTo(tail.x, tail.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();

    // Bright head dot
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${b.color},${b.alpha * 0.9})`;
    ctx.fill();

    if (b.life >= b.maxLife || b.x < -100 || b.x > cw+100 || b.y < -100 || b.y > ch+100) {
      beams.splice(i, 1);
    }
  });

  if (beams.length < MAX_BEAMS && Math.random() < 0.25) spawnBeam();
  requestAnimationFrame(drawBeams);
}
drawBeams();

const stage     = document.getElementById('stage');
const ctaTxt    = document.getElementById('ctaText');
const dotsEl    = document.getElementById('dots');
const progBar   = document.getElementById('progBar');
const counter   = document.getElementById('counter');
const scrollThumb = document.getElementById('scrollThumb');

let cur = 0, transitioning = false;
let rafProgress = null, pStart = null;
const DURATION = 8000;

// Scroll / wheel state
let wheelAcc = 0, wheelTimer = null;

SLIDES.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' on' : '');
  d.addEventListener('click', () => go(i, true));
  dotsEl.appendChild(d);
});

function updateUI() {
  dotsEl.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === cur));
  counter.textContent = `${cur + 1} / ${SLIDES.length}`;
  ctaTxt.textContent = SLIDES[cur].cta || 'Browse sponsored jobs';
  // Scroll thumb
  const pct = cur / (SLIDES.length - 1);
  const trackH = 60;
  const thumbH = Math.max(8, trackH / SLIDES.length);
  scrollThumb.style.height = thumbH + 'px';
  scrollThumb.style.top = (pct * (trackH - thumbH)) + 'px';
}

// ── HEADING FADE-UP ─────────────────────────────────────────────────
function animateHeading(el) {
  el.style.opacity = '0';
  el.style.transform = 'translateY(20px)';
  el.style.transition = 'none';
  requestAnimationFrame(() => {
    el.style.transition = 'opacity .6s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1)';
    el.style.opacity = '1';
    el.style.transform = 'none';
  });
}

// ── COUNT UP ────────────────────────────────────────────────────────
function countUp(el, target, suffix, duration) {
  const start = performance.now();
  function tick(now) {
    const t = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    const val = Math.round(ease * target);
    el.textContent = val.toLocaleString() + suffix;
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ── BUILD SLIDE ─────────────────────────────────────────────────────
function buildSlide(idx) {
  const s = SLIDES[idx];
  const div = document.createElement('div');
  div.className = 'slide-inner';

  if (s.type === 'hero') {
    div.innerHTML = s.h;
  } else {
    div.innerHTML = `
      <div class="split">
        <div class="split-copy">
          <div class="split-label">${s.label}</div>
          <h2 class="split-h2">${s.h2}</h2>
          <p class="split-body">${s.body}</p>
        </div>
        <div class="split-screen">${s.screen()}</div>
      </div>`;
  }
  return div;
}

// ── ANIMATE IN ──────────────────────────────────────────────────────
function animateIn(div, direction) {
  const s = SLIDES[cur];

  // Kinetic heading
  const heading = div.querySelector('.hero-h1, .split-h2');
  if (heading) animateHeading(heading);

  // Body fade up
  const body = div.querySelector('.split-body');
  if (body) {
    body.style.opacity = '0';
    body.style.transform = 'translateY(16px)';
    setTimeout(() => {
      body.style.transition = 'opacity .6s ease, transform .6s ease';
      body.style.opacity = '1';
      body.style.transform = 'none';
    }, 280);
  }

  // Label fade
  const label = div.querySelector('.split-label');
  if (label) {
    label.style.opacity = '0';
    setTimeout(() => { label.style.transition = 'opacity .5s'; label.style.opacity = '1'; }, 80);
  }

  // Count up numbers in stat chips
  div.querySelectorAll('.stat-chip strong').forEach(el => {
    const txt = el.textContent;
    const num = parseInt(txt.replace(/,/g, ''));
    const suffix = txt.replace(/[\d,]/g, '');
    if (!isNaN(num) && num > 1) {
      el.textContent = '0' + suffix;
      setTimeout(() => countUp(el, num, suffix, 1200), 400);
    }
  });

  // APP FRAME ASSEMBLY
  const frame = div.querySelector('.af');
  if (frame) {
    // Frame slides in from right
    frame.style.opacity = '0';
    frame.style.transform = 'translateX(40px) scale(0.96)';
    frame.style.transition = 'none';
    setTimeout(() => {
      frame.style.transition = 'opacity .65s cubic-bezier(.16,1,.3,1), transform .65s cubic-bezier(.16,1,.3,1)';
      frame.style.opacity = '1';
      frame.style.transform = 'none';
    }, 120);

    // Sidebar slides in from left
    const sidebar = frame.querySelector('.af-sidebar');
    if (sidebar) {
      sidebar.style.opacity = '0';
      sidebar.style.transform = 'translateX(-20px)';
      sidebar.style.transition = 'none';
      setTimeout(() => {
        sidebar.style.transition = 'opacity .5s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1)';
        sidebar.style.opacity = '1';
        sidebar.style.transform = 'none';
      }, 260);
    }

    // Cards stagger up
    const cards = frame.querySelectorAll('.gc');
    cards.forEach((card, i) => {
      card.style.opacity = '0';
      card.style.transform = 'translateY(18px)';
      card.style.transition = 'none';
      setTimeout(() => {
        card.style.transition = `opacity .5s ease, transform .5s cubic-bezier(.16,1,.3,1)`;
        card.style.opacity = '1';
        card.style.transform = 'none';
      }, 320 + i * 55);
    });

    // Bar chart draws itself
    const bars = frame.querySelectorAll('[style*="border-radius:2px 2px 0 0"], [style*="border-radius: 2px 2px 0 0"]');
    bars.forEach((bar, i) => {
      const finalH = bar.style.height;
      bar.style.height = '0px';
      bar.style.transition = 'none';
      setTimeout(() => {
        bar.style.transition = `height .6s cubic-bezier(.16,1,.3,1)`;
        bar.style.height = finalH;
      }, 400 + i * 40);
    });

    // Progress bars in tracker/analytics draw left to right
    frame.querySelectorAll('.prog-fill').forEach((p, i) => {
      const finalW = p.style.width;
      p.style.width = '0%';
      p.style.transition = 'none';
      setTimeout(() => {
        p.style.transition = 'width .8s cubic-bezier(.16,1,.3,1)';
        p.style.width = finalW;
      }, 500 + i * 80);
    });

    // Table rows stagger in
    frame.querySelectorAll('tbody tr').forEach((row, i) => {
      row.style.opacity = '0';
      row.style.transform = 'translateX(-12px)';
      row.style.transition = 'none';
      setTimeout(() => {
        row.style.transition = 'opacity .4s ease, transform .4s cubic-bezier(.16,1,.3,1)';
        row.style.opacity = '1';
        row.style.transform = 'none';
      }, 380 + i * 45);
    });

    // Stage tab counters count up
    frame.querySelectorAll('.tab-count, [style*="tab-count"]').forEach((el, i) => {
      const n = parseInt(el.textContent);
      if (!isNaN(n) && n > 0) {
        el.textContent = '0';
        setTimeout(() => countUp(el, n, '', 600), 300 + i * 60);
      }
    });
  }
}

// ── TRANSITION ──────────────────────────────────────────────────────
const SLIDE_EXIT_MS = 300;

function go(idx, user, direction) {
  if (transitioning) return;
  transitioning = true;

  const newIdx = ((idx % SLIDES.length) + SLIDES.length) % SLIDES.length;
  const dir = direction ?? (newIdx > cur ? 1 : -1);

  const old = stage.querySelector('.slide-inner.active');

  if (old) {
    old.classList.remove('active');
    old.style.transition = `opacity ${SLIDE_EXIT_MS}ms ease, transform ${SLIDE_EXIT_MS}ms ease, filter ${SLIDE_EXIT_MS}ms ease`;
    old.style.opacity = '0';
    old.style.filter = 'blur(4px)';
    old.style.transform = `translateY(${dir > 0 ? '-24px' : '24px'})`;
    setTimeout(() => old.remove(), SLIDE_EXIT_MS + 50);
  }

  cur = newIdx;

  // Build and insert new slide (starts invisible below/above)
  const div = buildSlide(cur);
  div.style.opacity = '0';
  div.style.filter = 'blur(6px)';
  div.style.transform = `translateY(${dir > 0 ? '32px' : '-32px'})`;
  div.style.transition = 'none';
  stage.appendChild(div);

  // One frame later, animate in
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      div.style.transition = 'opacity .55s cubic-bezier(.16,1,.3,1), transform .55s cubic-bezier(.16,1,.3,1), filter .55s ease';
      div.style.opacity = '1';
      div.style.filter = 'blur(0px)';
      div.style.transform = 'none';
      div.classList.add('active');
      animateIn(div, dir);
      transitioning = false;
    });
  });

  updateUI();
  if (user) { cancelAnimationFrame(rafProgress); startProgress(); }
}

// ── PROGRESS BAR ────────────────────────────────────────────────────
function startProgress() {
  cancelAnimationFrame(rafProgress);
  progBar.style.transition = 'none';
  progBar.style.width = '0%';
  pStart = performance.now();
  function tick(now) {
    const pct = Math.min(((now - pStart) / DURATION) * 100, 100);
    progBar.style.width = pct + '%';
    if (pct < 100) { rafProgress = requestAnimationFrame(tick); }
    else { go(cur + 1, false, 1); setTimeout(startProgress, 400); }
  }
  rafProgress = requestAnimationFrame(tick);
}

// ── CONTROLS ────────────────────────────────────────────────────────
document.getElementById('nextBtn').addEventListener('click', () => go(cur + 1, true, 1));
document.getElementById('prevBtn').addEventListener('click', () => go(cur - 1, true, -1));

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') go(cur + 1, true, 1);
  if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft')  go(cur - 1, true, -1);
});

// ── SCROLL JACK ─────────────────────────────────────────────────────
document.addEventListener('wheel', e => {
  e.preventDefault();
  wheelAcc += e.deltaY;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => {
    if (Math.abs(wheelAcc) > 30) {
      go(wheelAcc > 0 ? cur + 1 : cur - 1, true, wheelAcc > 0 ? 1 : -1);
    }
    wheelAcc = 0;
  }, 50);
}, { passive: false });

// Touch swipe
let tStartY = 0, tStartX = 0;
document.addEventListener('touchstart', e => {
  tStartY = e.touches[0].clientY;
  tStartX = e.touches[0].clientX;
}, { passive: true });
document.addEventListener('touchend', e => {
  const dy = tStartY - e.changedTouches[0].clientY;
  const dx = tStartX - e.changedTouches[0].clientX;
  if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 40) {
    go(dy > 0 ? cur + 1 : cur - 1, true, dy > 0 ? 1 : -1);
  } else if (Math.abs(dx) > 40) {
    go(dx > 0 ? cur + 1 : cur - 1, true, dx > 0 ? 1 : -1);
  }
});

// ═══════════════════════════════════════════════════════════════════
// 3. MAGNETIC CTA BUTTON
// ═══════════════════════════════════════════════════════════════════
const ctaBtn = document.getElementById('ctaBtn');
let ctaRaf = null, ctaX = 0, ctaY = 0, ctaTX = 0, ctaTY = 0;

ctaBtn.addEventListener('mousemove', e => {
  const r = ctaBtn.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top  + r.height / 2;
  ctaTX = (e.clientX - cx) * 0.28;
  ctaTY = (e.clientY - cy) * 0.28;
});
ctaBtn.addEventListener('mouseleave', () => { ctaTX = 0; ctaTY = 0; });

function magneticLoop() {
  ctaX += (ctaTX - ctaX) * 0.12;
  ctaY += (ctaTY - ctaY) * 0.12;
  ctaBtn.style.transform = `translate(${ctaX.toFixed(2)}px, ${ctaY.toFixed(2)}px)`;
  // Arrow tracks separately
  const arrow = ctaBtn.querySelector('.cta-arrow');
  if (arrow) arrow.style.transform = ctaTX > 4 ? 'translateX(4px)' : 'translateX(0)';
  ctaRaf = requestAnimationFrame(magneticLoop);
}
magneticLoop();

// ═══════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════
go(0, false, 1);
updateUI();
startProgress();
</script>
</body>
</html>
