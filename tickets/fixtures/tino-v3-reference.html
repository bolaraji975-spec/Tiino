<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Tino — Find jobs that will actually sponsor your UK visa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; padding: 0; margin: 0; }
:root {
  --bg: #021e1e; --bg-mid: #032a2a; --bg-hi: #033636;
  --teal: #1BAAC1; --teal-12: rgba(27,170,193,0.12); --teal-20: rgba(27,170,193,0.20);
  --teal-30: rgba(27,170,193,0.30); --teal-dim: #0a2828;
  --w100: #ffffff; --w80: rgba(255,255,255,0.80); --w60: rgba(255,255,255,0.60);
  --w40: rgba(255,255,255,0.40); --w20: rgba(255,255,255,0.20); --w10: rgba(255,255,255,0.10);
  --w06: rgba(255,255,255,0.06); --w03: rgba(255,255,255,0.03);
  --glass: rgba(3,40,40,0.80); --gborder: rgba(255,255,255,0.10);
  --font: 'Plus Jakarta Sans', sans-serif; --mono: 'DM Mono', monospace;
}
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--w100); -webkit-font-smoothing: antialiased; }

.bg-layer { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse 80% 60% at 60% 40%, #033e3e 0%, #021e1e 70%); }
.bg-grid {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size: 72px 72px; animation: gridDrift 18s linear infinite;
}
@keyframes gridDrift { from { background-position: 0 0; } to { background-position: 72px 72px; } }
.interactive-grid { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.grid-cell { position: absolute; border: 1px solid rgba(255,255,255,0); background: transparent; opacity: 0; transition: opacity 0.1s linear, border-color 0.1s linear, background-color 0.1s linear; }

/* ── WORD REVEAL ── */
@keyframes wordIn {
  0%   { opacity:0; transform: translateY(0.5em); filter: blur(4px); }
  100% { opacity:1; transform: translateY(0);     filter: blur(0); }
}
.w { display:inline-block; opacity:0; animation: wordIn 0.6s cubic-bezier(0.16,1,0.3,1) forwards; }

/* ── SPLIT-BODY REVEAL ── */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(16px); }
  to   { opacity:1; transform:translateY(0); }
}
.body-reveal { opacity:0; animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards; }

/* ── STAT CHIPS ── */
@keyframes chipIn {
  from { opacity:0; transform:translateY(10px) scale(0.95); }
  to   { opacity:1; transform:translateY(0)     scale(1); }
}
.chip-reveal { opacity:0; animation: chipIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }

/* ── APP FRAME ── */
@keyframes frameIn {
  from { opacity:0; transform:translateX(28px) scale(0.97); }
  to   { opacity:1; transform:translateX(0)    scale(1); }
}
.frame-reveal { opacity:0; animation: frameIn 0.7s cubic-bezier(0.16,1,0.3,1) forwards; }

.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 52px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 28px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  background: rgba(2,20,20,0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
}
.nav-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.nav-beta { font-family: var(--mono); font-size: 9px; font-weight: 400; letter-spacing: 1.5px; text-transform: uppercase; color: var(--teal); border: 1px solid var(--teal-30); padding: 3px 8px; border-radius: 3px; }
.nav-right { display: flex; align-items: center; gap: 20px; }
.nav-link { font-size: 13px; font-weight: 400; color: var(--w60); text-decoration: none; transition: color 0.15s; cursor: pointer; }
.nav-link:hover { color: var(--w100); }
.nav-cta { font-size: 13px; font-weight: 600; color: var(--teal-dim); background: var(--teal); padding: 7px 16px; text-decoration: none; transition: background 0.15s; cursor: pointer; border: none; }
.nav-cta:hover { background: #21c8e2; }

.stage { position: fixed; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; padding: 52px 0 132px; overflow: hidden; }

.slide-inner { width: 100%; max-width: 1300px; padding: 0 60px; opacity: 0; transform: translateY(32px) scale(0.98); transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1); }
.slide-inner.visible { opacity: 1; transform: translateY(0) scale(1); }
.slide-inner.exit { opacity: 0; transform: translateY(-20px) scale(0.97); transition: opacity 0.3s cubic-bezier(0.4,0,1,1), transform 0.3s cubic-bezier(0.4,0,1,1); }

/* HERO */
.hero-eyebrow { font-family: var(--mono); font-size: 11px; font-weight: 300; color: var(--teal); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 26px; opacity: 0.85; }
.hero-h1 { font-size: clamp(3.4rem, 7vw, 7rem); font-weight: 700; line-height: 1.04; letter-spacing: -0.03em; color: var(--w100); margin-bottom: 30px; }
.hero-h1 em { font-style: normal; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 8px; }
.hero-h1 .ac { color: var(--teal); }
.hero-stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--w60); background: rgba(27,170,193,0.07); border: 1px solid rgba(27,170,193,0.18); padding: 7px 14px; border-radius: 4px; }
.stat-chip strong { color: var(--teal); font-weight: 700; }
.stat-chip-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--teal-30); }

/* SPLIT */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
.split-label { font-family: var(--mono); font-size: 10px; font-weight: 300; color: rgba(27,170,193,0.55); letter-spacing: 1.8px; text-transform: uppercase; margin-bottom: 18px; }
.split-h2 { font-size: clamp(2rem, 3.5vw, 3.4rem); font-weight: 700; line-height: 1.08; letter-spacing: -0.025em; color: var(--w100); margin-bottom: 18px; }
.split-h2 em { font-style: normal; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
.split-h2 .ac { color: var(--teal); }
.split-body { font-size: 15px; font-weight: 400; line-height: 1.75; color: var(--w60); max-width: 400px; }

/* APP FRAME */
.af { background: var(--glass); border: 1px solid var(--gborder); border-radius: 14px; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,0.55), 0 0 0 1px rgba(27,170,193,0.05), inset 0 1px 0 rgba(255,255,255,0.06); backdrop-filter: blur(4px); }
.af-bar { display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: 38px; background: rgba(2,22,22,0.9); border-bottom: 1px solid rgba(255,255,255,0.07); }
.af-bar-title { font-size: 11px; font-weight: 600; color: var(--w80); }
.af-avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--teal); display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 800; color: var(--teal-dim); }
.af-body { padding: 14px; }
.af-side-layout { display: flex; height: 280px; }
.af-sidebar { width: 40px; background: rgba(2,18,18,0.8); border-right: 1px solid rgba(255,255,255,0.07); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 6px; flex-shrink: 0; }
.af-icon { width: 24px; height: 24px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--w40); }
.af-icon.on { background: rgba(27,170,193,0.12); color: var(--teal); }
.af-main { flex: 1; padding: 12px; overflow: hidden; }
.gc { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 10px 12px; }
.sh { background: rgba(74,222,128,0.12); color: #4ade80; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 3px; display: inline-flex; align-items: center; gap: 3px; }
.sm { background: rgba(251,191,36,0.12); color: #fbbf24; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 3px; display: inline-flex; align-items: center; gap: 3px; }
.sdot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.pill { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 100px; font-size: 10px; font-weight: 500; border: 1px solid rgba(255,255,255,0.14); color: rgba(255,255,255,0.55); }
.pill.on { background: rgba(27,170,193,0.10); border-color: rgba(27,170,193,0.30); color: var(--teal); }
.prog { height: 2px; background: rgba(255,255,255,0.07); border-radius: 1px; overflow: hidden; margin-top: 3px; }
.prog-fill { height: 100%; background: var(--teal); border-radius: 1px; }


.footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(2,16,16,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.footer-links { width: 28%; display: flex; gap: 16px; flex-wrap: wrap; }
.footer-link { font-size: 12px; color: var(--w40); text-decoration: none; transition: color 0.15s; }
.footer-link:hover { color: var(--w80); }
.controls { display: flex; align-items: center; gap: 14px; }
.ctrl-btn { cursor: pointer; font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); padding: 7px 16px; border-radius: 0; font-family: var(--font); transition: all 0.15s; }
.ctrl-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.16); color: var(--w80); }
.dots { display: flex; align-items: center; gap: 6px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.18); cursor: pointer; transition: all 0.45s cubic-bezier(0.34,1.56,0.64,1); }
.dot.on { background: rgba(255,255,255,0.70); width: 18px; border-radius: 3px; }
.counter { font-family: var(--mono); font-size: 10px; font-weight: 300; color: rgba(255,255,255,0.30); min-width: 36px; text-align: right; }

.cta-strip { position: fixed; bottom: 72px; left: 0; right: 0; z-index: 9; display: flex; justify-content: center; }
.cta-btn { display: inline-flex; align-items: center; gap: 12px; background: var(--teal); color: var(--teal-dim); font-family: var(--font); font-size: 14px; font-weight: 700; padding: 16px 36px; text-decoration: none; cursor: pointer; border: none; transition: background 0.25s cubic-bezier(0.16,1,0.3,1), gap 0.35s cubic-bezier(0.34,1.56,0.64,1), transform 0.25s cubic-bezier(0.34,1.56,0.64,1); }
.cta-btn:hover { background: #21c8e2; gap: 20px; transform: scale(1.02); }
.cta-arrow { fill: none; stroke: var(--teal-dim); width: 16px; height: 16px; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); }
.cta-btn:hover .cta-arrow { transform: translateX(5px); }

.prog-bar { position: fixed; bottom: 72px; left: 0; height: 2px; background: rgba(27,170,193,0.5); z-index: 11; pointer-events: none; }

@media(max-width:1100px) { .split { gap: 48px; } }
@media(max-width:860px) { .split { grid-template-columns: 1fr; } .split-screen { display: none; } .hero-h1 { font-size: clamp(2.6rem, 8vw, 4rem); } .slide-inner { padding: 0 24px; } }
@media(max-width:600px) { .footer-links { display: none; } .nav-link { display: none; } }
@media(prefers-reduced-motion:reduce) { .bg-grid { animation: none; } .slide-inner { transition: none; } }
</style>
</head>
<body>
<div class="bg-layer"></div>
<div class="bg-grid"></div>
<div class="interactive-grid" id="iGrid"></div>

<header class="nav">
  <div class="nav-logo">
    <svg width="54" height="22" viewBox="0 0 56 26" fill="none" aria-label="Tino">
      <line x1="2" y1="3" x2="13" y2="3" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round"/>
      <line x1="7.5" y1="3" x2="7.5" y2="23" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round"/>
      <rect x="16" y="2" width="6" height="6" rx="1.8" fill="#1BAAC1"/>
      <line x1="19" y1="10" x2="19" y2="23" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round"/>
      <line x1="24" y1="10" x2="24" y2="23" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round"/>
      <path d="M24 13 Q24 10 27.5 10 Q31 10 31 13 L31 23" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round" fill="none"/>
      <rect x="34" y="10" width="11" height="13" rx="4.5" stroke="rgba(255,255,255,0.85)" stroke-width="2" fill="none"/>
    </svg>
    <span class="nav-beta">Beta</span>
  </div>
  <div class="nav-right">
    <a class="nav-link" href="#">How it works</a>
    <a class="nav-link" href="#">Pricing</a>
    <a class="nav-cta" href="#">Sign in</a>
  </div>
</header>

<div class="stage" id="stage"></div>

<div class="cta-strip">
  <button class="cta-btn" id="ctaBtn">
    <span id="ctaText">Browse sponsored jobs</span>
    <svg class="cta-arrow" viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 8h10M9 4l4 4-4 4"/>
    </svg>
  </button>
</div>

<footer class="footer">
  <div class="footer-links">
    <a class="footer-link" href="#">Privacy</a>
    <a class="footer-link" href="#">Terms</a>
    <a class="footer-link" href="#">Blog</a>
    <a class="footer-link" href="#">LinkedIn</a>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="prevBtn">← Prev</button>
    <div class="dots" id="dots"></div>
    <button class="ctrl-btn" id="nextBtn">Next →</button>
  </div>
  <div class="counter" id="counter">1 / 8</div>
</footer>

<div class="prog-bar" id="progBar" style="width:0%"></div>

<script>
const LOGO = `<svg width="32" height="14" viewBox="0 0 56 26" fill="none"><line x1="2" y1="3" x2="13" y2="3" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/><line x1="7.5" y1="3" x2="7.5" y2="23" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/><rect x="16" y="2" width="6" height="6" rx="1.8" fill="#1BAAC1"/><line x1="19" y1="10" x2="19" y2="23" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/><line x1="24" y1="10" x2="24" y2="23" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/><path d="M24 13 Q24 10 27.5 10 Q31 10 31 13 L31 23" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" fill="none"/><rect x="34" y="10" width="11" height="13" rx="4.5" stroke="rgba(255,255,255,0.8)" stroke-width="2" fill="none"/></svg>`;

const TOPBAR = t => `<div class="af-bar"><div style="display:flex;align-items:center;gap:8px;">${LOGO}<span class="af-bar-title">${t}</span></div><div class="af-avatar">AT</div></div>`;

const SIDEBAR = a => `<div class="af-sidebar">
  <div class="af-icon ${a===0?'on':''}" title="Jobs">◉</div>
  <div class="af-icon ${a===1?'on':''}" title="Tracker">▤</div>
  <div class="af-icon ${a===2?'on':''}" title="CV">≡</div>
  <div class="af-icon ${a===3?'on':''}" title="Analytics">↗</div>
  <div style="margin-top:auto;" class="af-icon" title="Sign out">↩</div>
</div>`;

function sLogin() {
  return `<div class="af" style="max-width:320px;margin:0 auto;">${TOPBAR('Sign in')}
  <div class="af-body" style="padding:20px;">
    <div style="margin-bottom:18px;">
      <div style="font-size:15px;font-weight:700;margin-bottom:5px;letter-spacing:-0.3px;">Welcome back.</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.52);">Sign in to your sponsorship tracker</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:13px;">
      <div>
        <div style="font-size:10px;color:rgba(255,255,255,0.52);margin-bottom:5px;font-weight:500;letter-spacing:0.2px;">Email</div>
        <div style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.16);border-radius:5px;padding:8px 11px;font-size:11px;color:rgba(255,255,255,0.40);">you@example.com</div>
      </div>
      <div>
        <div style="font-size:10px;color:rgba(255,255,255,0.52);margin-bottom:5px;font-weight:500;letter-spacing:0.2px;">Password</div>
        <div style="background:rgba(255,255,255,0.07);border:1px solid rgba(27,170,193,0.45);border-radius:5px;padding:8px 11px;font-size:11px;color:rgba(255,255,255,0.55);">••••••••</div>
      </div>
      <div style="text-align:right;font-size:10px;color:#1BAAC1;cursor:pointer;">Forgot password?</div>
    </div>
    <div style="background:#1BAAC1;color:#0a2828;padding:10px;text-align:center;font-size:12px;font-weight:700;margin-bottom:11px;cursor:pointer;border-radius:2px;">Sign in →</div>
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:11px;">
      <div style="flex:1;height:1px;background:rgba(255,255,255,0.10);"></div>
      <span style="font-size:10px;color:rgba(255,255,255,0.45);">or</span>
      <div style="flex:1;height:1px;background:rgba(255,255,255,0.10);"></div>
    </div>
    <div style="border:1px solid rgba(255,255,255,0.16);border-radius:2px;padding:9px;text-align:center;font-size:11px;color:rgba(255,255,255,0.65);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;">
      <span style="font-weight:800;color:#4285f4;font-size:13px;">G</span>Continue with Google
    </div>
    <div style="text-align:center;margin-top:12px;font-size:10px;color:rgba(255,255,255,0.48);">No account? <span style="color:#1BAAC1;cursor:pointer;">Create one free →</span></div>
  </div></div>`;
}

function sOnboarding() {
  const steps = ['Visa type','Upload CV','Your roles','Alerts'];
  return `<div class="af" style="max-width:420px;margin:0 auto;">${TOPBAR('Get started')}
  <div class="af-body">
    <div style="display:flex;align-items:center;margin-bottom:18px;overflow-x:auto;scrollbar-width:none;">
      ${steps.map((s,i)=>`<div style="display:flex;align-items:center;gap:0;"><div style="display:flex;align-items:center;gap:5px;padding:4px 0;"><div style="width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;background:${i<2?'#1BAAC1':'rgba(255,255,255,0.08)'};color:${i<2?'#0a2828':'rgba(255,255,255,0.38)'};">${i<2?'✓':(i+1)}</div><span style="font-size:11px;white-space:nowrap;color:${i===1?'#1BAAC1':'rgba(255,255,255,0.42)'};">${s}</span></div>${i<3?`<div style="width:18px;height:1px;background:rgba(255,255,255,0.12);margin:0 5px;flex-shrink:0;"></div>`:''}</div>`).join('')}
    </div>
    <div style="text-align:center;margin-bottom:14px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:6px;letter-spacing:-0.2px;">Upload your CV</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.52);line-height:1.55;max-width:260px;margin:0 auto;">Claude reads it and suggests matching job titles automatically.</div>
    </div>
    <div style="border:1px dashed rgba(27,170,193,0.30);border-radius:7px;padding:22px;text-align:center;background:rgba(27,170,193,0.03);margin-bottom:12px;">
      <div style="font-size:22px;margin-bottom:7px;opacity:0.55;">↑</div>
      <div style="font-size:12px;font-weight:600;margin-bottom:4px;">Drop your CV here</div>
      <div style="font-size:10px;color:rgba(255,255,255,0.48);">PDF or Word · max 10MB · click to browse</div>
    </div>
    <div style="font-size:10px;color:rgba(255,255,255,0.45);text-align:center;margin-bottom:13px;">ⓘ Your CV is never shared with employers</div>
    <div style="display:flex;gap:8px;">
      <div style="flex:1;border:1px solid rgba(255,255,255,0.16);border-radius:2px;padding:9px;text-align:center;font-size:11px;color:rgba(255,255,255,0.52);cursor:pointer;">← Back</div>
      <div style="flex:2;background:#1BAAC1;color:#0a2828;border-radius:2px;padding:9px;text-align:center;font-size:11px;font-weight:700;cursor:pointer;">Continue →</div>
    </div>
  </div></div>`;
}

function sJobs() {

function mapRange(val, inMin, inMax, outMin, outMax) {
  return outMin + (outMax - outMin) * Math.max(0, Math.min(1, (val - inMin) / (inMax - inMin)));
}
function lerp(a, b, t) { return a + (b - a) * t; }

function animateWords(el, baseDelay) {
  let idx = 0;
  function walk(node) {
    if (node.nodeType === Node.TEXT_NODE) {
      const parts = node.textContent.split(/(\s+)/);
      const frag = document.createDocumentFragment();
      parts.forEach(p => {
        if (/^\s+$/.test(p) || p === '') { frag.appendChild(document.createTextNode(p)); }
        else {
          const s = document.createElement('span');
          s.className = 'w';
          s.style.animationDelay = (baseDelay + idx * 55) + 'ms';
          s.textContent = p; idx++;
          frag.appendChild(s);
        }
      });
      node.parentNode.replaceChild(frag, node);
    } else if (node.nodeType === Node.ELEMENT_NODE && node.tagName !== 'BR') {
      Array.from(node.childNodes).forEach(walk);
    }
  }
  Array.from(el.childNodes).forEach(walk);
}

  // Fade-up body
  const body = div.querySelector('.split-body');
  if (body) { body.classList.add('body-reveal'); body.style.animationDelay = '240ms'; }
  // Spring-in stat chips
  div.querySelectorAll('.stat-chip').forEach((el, i) => {
    el.classList.add('chip-reveal');
    el.style.animationDelay = (200 + i * 70) + 'ms';
  });
  // Slide-in app frame
  const frame = div.querySelector('.af');
  if (frame) { frame.classList.add('frame-reveal'); frame.style.animationDelay = '100ms'; }
  return div;
}

function render(idx) {
  const old = stage.querySelector('.slide-inner');
  if (!old) {
    const div = buildSlide(idx);
    stage.appendChild(div);
    requestAnimationFrame(() => div.classList.add('visible'));
    return;
  }
  if (transitioning) return;
  transitioning = true;
  old.classList.add('exit');
  setTimeout(() => {
    old.remove();
    const div = buildSlide(idx);
    stage.appendChild(div);
    requestAnimationFrame(() => { div.classList.add('visible'); transitioning = false; });
  }, 320);
}

function go(idx, user) {
  if (transitioning) return;
  cur = ((idx % SLIDES.length) + SLIDES.length) % SLIDES.length;
  render(cur); updateUI();
  if (user) { cancelAnimationFrame(raf); startProgress(); }
}

function startProgress() {
  cancelAnimationFrame(raf);
  progBar.style.width = '0%';
  pStart = performance.now();
  function tick(now) {
    const pct = Math.min(((now - pStart) / DURATION) * 100, 100);
    progBar.style.width = pct + '%';
    if (pct < 100) { raf = requestAnimationFrame(tick); }
    else { go(cur+1, false); setTimeout(startProgress, 500); }
  }
  raf = requestAnimationFrame(tick);
}

document.getElementById('nextBtn').addEventListener('click', () => go(cur+1, true));
document.getElementById('prevBtn').addEventListener('click', () => go(cur-1, true));
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') go(cur+1, true);
  if (e.key==='ArrowLeft' ||e.key==='ArrowUp')   go(cur-1, true);
});
let tx=0;
document.addEventListener('touchstart', e => { tx=e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend',   e => { const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>48) go(dx<0?cur+1:cur-1, true); });

// ── INTERACTIVE GRID ──────────────────────────────────────────────────────────
const CELL=72; let cells=[];
function buildGrid() {
  const g=document.getElementById('iGrid'); g.innerHTML=''; cells=[];
  const cols=Math.ceil(window.innerWidth/CELL)+1, rows=Math.ceil(window.innerHeight/CELL)+1;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
    const el=document.createElement('div'); el.className='grid-cell';
    el.style.cssText=`left:${c*CELL}px;top:${r*CELL}px;width:${CELL}px;height:${CELL}px`;
    g.appendChild(el); cells.push({el, cx:c*CELL+CELL/2, cy:r*CELL+CELL/2});
  }
}
function light(x,y) {
  const R=CELL*3.2;
  cells.forEach(({el,cx,cy}) => {
    const d=Math.sqrt((cx-x)**2+(cy-y)**2);
    const t=mapRange(d,0,R,1,0);
    if(t>0.01){ el.style.borderColor=`rgba(27,170,193,${(t*0.30).toFixed(3)})`; el.style.backgroundColor=`rgba(27,170,193,${(t*0.05).toFixed(3)})`; el.style.opacity=t.toFixed(3); }
    else { el.style.borderColor='rgba(255,255,255,0)'; el.style.backgroundColor='transparent'; el.style.opacity='0'; }
  });
}
// Lerp-smoothed cursor follow
let mouseX=window.innerWidth/2, mouseY=window.innerHeight/2;
let gridX=mouseX, gridY=mouseY;
document.addEventListener('mousemove', e => { mouseX=e.clientX; mouseY=e.clientY; });
document.addEventListener('touchmove', e => { mouseX=e.touches[0].clientX; mouseY=e.touches[0].clientY; }, {passive:true});
setInterval(() => { if(window.innerWidth<=768){ mouseX=Math.random()*window.innerWidth; mouseY=Math.random()*window.innerHeight; }}, 1600);
function gridLoop() {
  gridX=lerp(gridX,mouseX,0.07); gridY=lerp(gridY,mouseY,0.07);
  light(gridX,gridY);
  requestAnimationFrame(gridLoop);
}
window.addEventListener('resize', buildGrid);
buildGrid(); gridLoop();

render(0); updateUI(); startProgress();
</script>
</body>
